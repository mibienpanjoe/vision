name: vision
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: vision
      POSTGRES_DB: vision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.10-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the private .env file}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  # Packaged application (T45): `docker compose --profile app up -d --wait`. Images carry no secrets, books or
  # model weights; credentials come from the private .env and models are mounted read-only.
  migrate:
    profiles: [app]
    image: vision-api:local
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://vision:${POSTGRES_PASSWORD}@db:5432/vision
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      VISION_WEB_ORIGINS: http://127.0.0.1:${VISION_WEB_PORT:-3000},http://localhost:${VISION_WEB_PORT:-3000}
      VISION_TRUSTED_HOSTS: api,127.0.0.1,localhost
      VISION_NARRATIVE_PROVIDER: ${VISION_NARRATIVE_PROVIDER:-local}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISION_RENDER_PROVIDER: ${VISION_RENDER_PROVIDER:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    profiles: [app]
    image: vision-api:local
    environment: *app-environment
    # Listens on the stack's private network only; nothing publishes it, so the host reaches it through the web.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: &app-volumes
      - originals:/data/originals
      - renders:/data/renders
      - ${VISION_HF_HOME:-${HOME}/.cache/huggingface}:/models/huggingface:ro
      - ./.local/docling-models:/models/docling:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    profiles: [app]
    image: vision-api:local
    environment: *app-environment
    volumes: *app-volumes
    # Publish pending intents first, then consume; SIGTERM lets the current message finish or requeue.
    command: ["sh", "-c", "python -m app.workers.dispatch && exec dramatiq app.workers.bootstrap --processes 1 --threads 1"]
    stop_grace_period: 120s
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    profiles: [app]
    image: vision-web:local
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile}
    ports:
      - "127.0.0.1:${VISION_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
volumes:
  redis-data:
  postgres-data:
  originals:
  renders:
