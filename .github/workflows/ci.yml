name: Foundation CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.15'
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.28.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Frozen setup and local services
        run: make setup services migrate
      - name: Install browser dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Static, contract, unit, build and browser shell checks
        run: make check
      - name: Real database, broker, worker and browser session checks
        run: make integration browser-session
      - name: Known JavaScript dependency advisories
        run: pnpm audit --audit-level=high
      - name: Remove disposable CI services
        if: always()
        run: docker compose down --volumes
